<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genesis Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Dev-only QA hook: ?e2e=1 injects a persisted scene snapshot before the
      // app boots, letting a human drive the real Studio shell end to end.
      if (new URLSearchParams(location.search).has('e2e')) {
        const snapshot = await fetch('/e2e-snapshot.json').then((r) => r.json());
        window.__GENESIS_SNAPSHOT__ = snapshot;
      }
      await import('/src/main.tsx');
    </script>
  </body>
</html>
