[package]
name = "genesis-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Headless command surface for Genesis Core"

[[bin]]
name = "genesis"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
genesis-core = { path = "../genesis-core" }
serde = "1"
serde_json = "1"
